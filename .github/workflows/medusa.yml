name: medusa
on:
  workflow_dispatch:
    inputs:
      timeout:
        description: 'Timeout in seconds'
        required: true
        default: '300'
      test_limit:
        description: 'Medusa testLimit (0 = unlimited until timeout)'
        required: true
        default: '0'

permissions:
  contents: write

jobs:
  medusa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Build
        run: forge build --skip test --skip script
      - name: Install Medusa
        run: medusa --version || true
      - name: Install crytic-compile
        run: pip install crytic-compile slither-analyzer
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Medusa
        run: |
          go install github.com/crytic/medusa@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Run Medusa
        run: |
          set +e
          export PATH=$PATH:$HOME/go/bin
          medusa fuzz --config medusa.json --timeout 300 --test-limit 0 > medusa-out.txt 2>&1
          echo "EXIT=$?" >> medusa-out.txt
          tail -c 15000 medusa-out.txt > medusa-tail.txt || cp medusa-out.txt medusa-tail.txt
          git config user.name "medusa-bot"
          git config user.email "medusa-bot@local"
          git add -f medusa-tail.txt
          git commit -m "medusa tail" || true
          git push origin HEAD:main
          exit 0
