name: gohybrid-spike
on:
  push:
    branches: [spike/gohybrid-1119]
jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: {repository: limitlessprojects/Go-Hybrid, ref: main, path: gh}
      - uses: actions/setup-go@v5
        with: {go-version: 1.26.9, cache-dependency-path: gh/go.sum}
      - run: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.0
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: gh/compiler -> target}
      - name: write reconstructed clash test
        run: |
          cat > gh/compiler/crates/hy-check/tests/field_method_name_clash.rs <<'EOF'
          use hy_check::check_file;
          use hy_syntax::parse_file;
          fn codes(src: &str) -> Vec<String> {
              let ast = parse_file("test.hy", src).expect("parses");
              check_file(&ast).diagnostics.into_iter().map(|d| d.code).collect()
          }
          #[test]
          fn value_receiver_clash_rejects_e1002() {
              let cs = codes("struct counter {\n    n int\n}\nfn (c counter) n() int {\n    return 1\n}\nfn main() {\n    c := counter{n: 2}\n}\n");
              assert!(cs.iter().any(|c| c == "HYB-E1002"), "expected HYB-E1002, got {cs:?}");
          }
          #[test]
          fn pointer_receiver_clash_rejects_e1002() {
              let cs = codes("struct counter {\n    n int\n}\nfn (c *counter) n() int {\n    return 1\n}\nfn main() {\n    c := counter{n: 2}\n}\n");
              assert!(cs.iter().any(|c| c == "HYB-E1002"), "expected HYB-E1002, got {cs:?}");
          }
          #[test]
          fn distinct_names_pass() {
              let cs = codes("struct counter {\n    n int\n}\nfn (c counter) get() int {\n    return 1\n}\nfn main() {\n    c := counter{n: 2}\n}\n");
              assert!(cs.is_empty(), "expected 0 diagnostics, got {cs:?}");
          }
          EOF
      - name: single-test red repro
        run: |
          export PATH="$HOME/.cargo/bin:/usr/local/go/bin:$PATH"
          cd gh/compiler && cargo test -p hy-check --test field_method_name_clash -- --nocapture
