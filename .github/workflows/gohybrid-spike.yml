name: gohybrid-spike
on:
  push:
    branches: [spike/gohybrid-1119]
jobs:
  red:
    permissions: {contents: write}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: {repository: limitlessprojects/Go-Hybrid, ref: main, path: gh}
      - uses: actions/setup-go@v5
        with: {go-version: 1.26.9}
      - run: curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.99.0
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: gh/compiler -> target}
      - name: write clash test (base64, no heredoc)
        run: python3 -c "import base64;open('gh/compiler/crates/hy-check/tests/field_method_name_clash.rs','wb').write(base64.b64decode(''))"
      - name: single-test red repro
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          which cargo; cargo --version; ls gh/compiler/crates/hy-check/tests/ | head
          cd gh/compiler && cargo test -p hy-check --test field_method_name_clash -- --nocapture > /tmp/t.log 2>&1; code=$?; tail -30 /tmp/t.log; echo RED_CODE=$code
          CLEAN=$(sed "s/\x1b\[[0-9;]*m//g" /tmp/t.log); echo "$CLEAN" | wc -l | sed "s/^/::notice::LOGLINES=/"; echo "$CLEAN" | grep -aiE "error|test result|FAILED|passed|panicked|compiling|finished|cannot|failed" | head -30 | sed "s/^/::notice::/" || true
          exit $code
      - name: report tail as commit comment
        if: always()
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
        run: |
          MSG=$(tail -c 2500 /tmp/t.log 2>/dev/null || echo no-log-file); printf "cargo tail:\n%s\n" "$MSG" | gh api repos/doishy-doish/v4lend/commits/${{ github.sha }}/comments -F body=@- || true
