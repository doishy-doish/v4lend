name: fuzz-night
on:
  workflow_dispatch:
    inputs:
      hours:
        description: soak hours
        default: "8"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Forge build gate
        run: forge build
  echidna-custody:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Echidna custody soak
        run: |
          pip install echidna
          H=$(( ${{ inputs.hours }} * 3600 ))
          timeout $H echidna . --contract CustodyInvariant --config echidna.yaml --test-limit 1000000 || code=$?
          if [ "$code" -eq 124 ]; then echo "soak used full window, no failure"; exit 0; fi
          exit $code
  pending-harness:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        campaign: [debt, solvency, lock, abstraction-oracle, abstraction-accrual]
    steps:
      - uses: actions/checkout@v4
      - name: Pending harness marker
        run: echo "campaign={{ matrix.campaign }} PENDING-HARNESS no test file yet"

  collect:
    needs: [echidna-custody, pending-harness]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect results
        run: echo "collect after all campaigns, none blocked by siblings"
