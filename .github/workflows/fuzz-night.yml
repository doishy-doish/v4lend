name: fuzz-night
on:
  workflow_dispatch:
    inputs:
      hours:
        description: soak hours
        default: "8"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Forge build gate
        run: forge build
  echidna-custody:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Echidna custody soak
        run: |
          pip install echidna 2>/dev/null || true
          ls test/echidna/
  pending-harness:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        campaign: [debt, solvency, lock, abstraction-oracle, abstraction-accrual]
    steps:
      - uses: actions/checkout@v4
      - name: Pending harness marker
        run: echo "campaign={{ matrix.campaign }} PENDING-HARNESS no test file yet"
