name: arc-summarize
on:
  workflow_dispatch:
    inputs:
      run_ids:
        description: "Comma-separated run ids"
        default: ""
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and summarize
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_IDS: ${{ inputs.run_ids }}
        run: |
          mkdir -p art
          for ID in $(echo "$RUN_IDS" | tr ',' ' '); do
            gh run download "$ID" -n real-game-probe -D "art/$ID" --repo "$GITHUB_REPOSITORY" > "fetch-$ID.log" 2>&1 || echo "DOWNLOAD-FAILED $ID" > "fetch-$ID.log"
          done
          python3 - <<'PYEOF' > summary.md 2> pyerr.log
          import json, glob
          print("# v7.29 probe summaries")
          print("")
          print("| run | game | levels | actions | wall_s | clicks | combo | best_lc | fam | strip | r0 | l1 | tdlast5 | near |")
          print("|---|---|---|---|---|---|---|---|---|---|---|---|---|---|")
          for p in sorted(glob.glob("art/*/probe-results.json")):
              j = json.load(open(p))
              h = j.get("harness", {}) or {}
              td = h.get("tdhist", []) or []
              print("| " + p.split("/")[1] + " | " + str(j.get("game")) + " | " + str(j.get("levels")) + " | " + str(j.get("actions")) + " | " + str(j.get("wall_s")) + " | " + str(h.get("sk_clicks")) + " | " + str(h.get("combo_done")) + " | " + str(h.get("best_lc")) + " | " + str(h.get("fam")) + " | " + str(h.get("strip_clicks")) + " | " + str(h.get("r0_clicks")) + " | " + str(h.get("l1clicks")) + " | " + str(td[-5:]) + " | " + str(h.get("near_int")) + " |")
          print("")
          PYEOF
          cat summary.md
      - name: Commit summary
        env:
          GH_TOKEN: ${{ secrets.ARC_CLASSIC }}
        run: |
          B64=$(base64 -w0 summary.md)
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/results/v729-summary.md" --jq .sha 2>/dev/null || echo "")
          if [ -z "$SHA" ]; then gh api "repos/$GITHUB_REPOSITORY/contents/results/v729-summary.md" --method PUT -f message="v7.29 probe summaries" -f content="$B64" --jq .content.sha; else gh api "repos/$GITHUB_REPOSITORY/contents/results/v729-summary.md" --method PUT -f message="v7.29 probe summaries" -f content="$B64" -f sha="$SHA" --jq .content.sha; fi
