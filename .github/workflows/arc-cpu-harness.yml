name: arc-cpu-harness
on:
  workflow_dispatch: {}
  push:
    paths: [arc-harness/**, .github/workflows/arc-cpu-harness.yml]
jobs:
  cpu-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python3 -c "import sys; print(sys.version)"
          echo CPU_COUNT=$(nproc)
          grep MemTotal /proc/meminfo
          ls arc-harness 2>/dev/null || echo NO_HARNESS_YET
