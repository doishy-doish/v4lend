name: arc-cpu-harness
on:
  workflow_dispatch: {}
  push:
    paths: [arc-harness/**, .github/workflows/arc-cpu-harness.yml]
jobs:
  cpu-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          echo CPU_COUNT=$(nproc)
          grep MemTotal /proc/meminfo
      - run: pip install -q -r arc-harness/requirements.txt
      - run: cd arc-harness && python3 -m pytest -q
      - run: cd arc-harness && cat blast-metrics.json || true
      - run: cd arc-harness && cat preflight-metrics.json || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harness-metrics
          path: |
            arc-harness/blast-metrics.json
            arc-harness/preflight-metrics.json
          if-no-files-found: warn
