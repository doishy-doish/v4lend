name: arc-model-probe
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q llama-cpp-python
      - run: cd arc-harness && python3 model_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-probe
          path: arc-harness/model-probe-metrics.json
          if-no-files-found: warn
