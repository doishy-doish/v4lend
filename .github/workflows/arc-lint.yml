name: arc-lint
on:
  workflow_dispatch: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: |
          python3 -m py_compile arc-harness/real_probe/my_agent.py > results-lint.log 2>&1; echo "my_agent exit=$?" >> results-lint.log
          if [ -f arc-harness/real_probe/model_driver.py ]; then python3 -m py_compile arc-harness/real_probe/model_driver.py >> results-lint.log 2>&1; echo "model_driver exit=$?" >> results-lint.log; fi
          cat results-lint.log
      - name: Commit log
        env:
          GH_TOKEN: ${{ secrets.ARC_CLASSIC }}
        run: |
          B64=$(base64 -w0 results-lint.log)
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/results/lint.log" --jq .sha 2>/dev/null || echo "")
          if [ -z "$SHA" ]; then gh api "repos/$GITHUB_REPOSITORY/contents/results/lint.log" --method PUT -f message="lint log" -f content="$B64" --jq .content.sha;
          else gh api "repos/$GITHUB_REPOSITORY/contents/results/lint.log" --method PUT -f message="lint log" -f content="$B64" -f sha="$SHA" --jq .content.sha; fi
