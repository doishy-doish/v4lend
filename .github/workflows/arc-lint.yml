name: arc-lint
on:
  workflow_dispatch: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: |
          python3 -m py_compile arc-harness/real_probe/my_agent.py > results-lint.log 2>&1; echo "my_agent exit=$?" >> results-lint.log
          cat results-lint.log
      - name: Import and trial
        run: |
          pip install -q arc-agi pydantic 2>&1 | tail -1; pip install -q arcengine 2>&1 | tail -1 || true
          git clone --depth 1 https://github.com/arcprize/ARC-AGI-3-Agents.git vendor/ARC-AGI-3-Agents 2>&1 | tail -1
          cd arc-harness/real_probe && timeout 120 python3 driver.py --game ls20 --max-steps 5 > trial.log 2>&1; echo "trial exit=$?" >> trial.log; cd ../..
          tail -c 3000 arc-harness/real_probe/trial.log
      - name: Commit logs
        env:
          GH_TOKEN: ${{ secrets.ARC_CLASSIC }}
        run: |
          for F in results-lint.log arc-harness/real_probe/trial.log; do
            B=$(basename $F .log); B64=$(base64 -w0 $F)
            SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/results/$B.log" --jq .sha 2>/dev/null || echo "")
            if [ -z "$SHA" ]; then gh api "repos/$GITHUB_REPOSITORY/contents/results/$B.log" --method PUT -f message="lint log" -f content="$B64" --jq .content.sha;
            else gh api "repos/$GITHUB_REPOSITORY/contents/results/$B.log" --method PUT -f message="lint log" -f content="$B64" -f sha="$SHA" --jq .content.sha; fi
          done
