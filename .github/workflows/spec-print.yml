name: spec-print
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          {
            echo CPU_COUNT=$(nproc)
            grep -E 'MemTotal|MemAvailable' /proc/meminfo
            free -h | head -2
            df -h / | tail -1
          } | tee spec-result.txt
      - run: |
          git config user.name spec-bot && git config user.email spec-bot@localhost
          git add spec-result.txt && git commit -m 'spec result' && git push
